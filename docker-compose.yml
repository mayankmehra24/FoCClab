# ============================================================
# FoCC Lab 2 - docker-compose (local development & testing)
# Two-tier: Flask frontend + Redis backend
# ============================================================
services:

  # ---- Backend: Redis ----
  redis:
    image: redis:7.2-alpine
    container_name: focc_redis
    restart: unless-stopped
    ports:
      - "6379:6379" # expose only for local debugging
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  # ---- Frontend: Flask ----
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime # use the slim runtime stage
    container_name: focc_frontend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_VERSION=1.0.0
      - FLASK_DEBUG=false
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health/live')" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app_net

volumes:
  redis_data:
    driver: local

networks:
  app_net:
    driver: bridge
